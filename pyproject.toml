[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sponsorscout"
version = "0.1.1"
description = "Verified sponsorship-focused job discovery for international candidates"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=4.9.0,<6.0.0",
    "Pillow>=10.0.0,<11.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://sponsorscout.app"
Repository = "https://github.com/your-org/SponsorScout"
Issues = "https://github.com/your-org/SponsorScout/issues"

[project.scripts]
sponsorscout = "sponsorscout.ui.app:main"
sponsorscout-scan = "sponsorscout.scripts.run_scan:main"
sponsorscout-import = "sponsorscout.scripts.import_companies:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sponsorscout*"]

[tool.setuptools.package-data]
sponsorscout = ["data/*.json", "data/*.csv", "data/*.png", "data/*.ico", "data/icons/*.png", "db/*.sql"]